services:
  postgres:
    image: postgres:16-alpine
    container_name: mim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mim-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mim-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:${DB_PORT:-5432}/${DB_NAME}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BTC_DATA_DIR:-/tmp/mim-btcdata}:/bitcoin-data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mim-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mim-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-3001}
      NEXT_PUBLIC_WS_URL: ws://localhost:${BACKEND_PORT:-3001}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - mim-network

volumes:
  pg_data:

networks:
  mim-network:
    driver: bridge
